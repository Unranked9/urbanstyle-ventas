# ============================================================
#  Parámetros de negocio de UrbanStyle.
#  (La nueva BD no tiene tabla "empresa", por eso viven aquí.)
# ============================================================

# IGV en porcentaje. Se suma sobre el subtotal, igual que la versión anterior.
venta.igv.porcentaje=18

# Series de comprobantes (payment_documents.series)
comprobante.serie.boleta=B001
comprobante.serie.factura=F001

# Una variante con stock menor o igual a este valor se considera "stock bajo".
producto.stock.bajo=5

# Carpeta donde se guardan las imágenes de las variantes.
# Vacío = carpeta "urbanstyle-uploads" dentro del directorio del usuario.
# También se puede definir con la variable de entorno URBANSTYLE_UPLOADS_DIR.
uploads.dir=
